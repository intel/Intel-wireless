site_name: Intel Wireless
site_url: https://intel.github.io/Intel-wireless/
site_description: Integration guides for Intel Wi-Fi on non-x86 platforms

repo_url: https://github.com/intel/Intel-wireless
repo_name: intel/Intel-wireless

copyright: "© Intel Corporation. Intel, the Intel logo, and other Intel marks are trademarks of Intel Corporation or its subsidiaries. Other names and brands may be claimed as the property of others."

theme:
  name: material
  features:
    - navigation.sections       # Left sidebar collapsible sections
    - navigation.expand         # Auto-expand sidebar sections
    - navigation.indexes        # Section index pages
    - navigation.top            # Back-to-top button
    - navigation.footer         # Previous/Next page links at bottom
    - search.suggest            # Search suggestions
    - search.highlight          # Highlight matches in results
    - content.code.copy         # Copy button on code blocks
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Right sidebar - "On This Page" table of contents
markdown_extensions:
  - toc:
      permalink: true           # Anchor links on headings
  - pymdownx.highlight:         # Code syntax highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences        # Fenced code blocks
  - pymdownx.tabbed:            # Tabbed content
      alternate_style: true
  - admonition                  # Note/warning/tip boxes
  - pymdownx.details            # Collapsible admonitions
  - pymdownx.snippets:          # Shared content (latest release) from includes/
      base_path: [includes]
      check_paths: true

# Allow docs-root absolute links (/releases/...) in shared snippets
validation:
  links:
    absolute_links: relative_to_docs

# Rebuild on snippet changes during `mkdocs serve`
watch:
  - includes

plugins:
  - search                      # Built-in instant search

# Left sidebar navigation tree
nav:
  - Home: index.md
  - Hardware Requirements: getting-started/hardware-requirements.md
  - Integration Guide:
    - Overview: build/index.md
    - Native Build from Source: build/native-build.md
    - Cross-Compilation: build/cross-compile.md
  - Firmware:
    - Installation: firmware/installation.md
  - Platform-Specific Guidance:
    - NVIDIA Jetson: platforms/jetson/index.md
    - Canonical Ubuntu (DKMS): platforms/canonical-ubuntu.md
  - Wi-Fi Configuration: configuration/index.md
  - Releases:
    - Overview: releases/index.md
    - core24.80 Release Notes: releases/core24.80.md
  - Troubleshooting:
    - Debugging Guide: troubleshooting/index.md
    - FAQ: troubleshooting/faq.md
